<!DOCTYPE html>
<html class="theme-auto" lang="zh-CN">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>欢迎联系我</title>
    <link rel="icon" type="image/x-icon" href="images/avatar.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
  </head>

<body>

  <div class="container">
    <div class="column">

        <img class="avatar avatar--rounded" src="images/wecode.png" style="width: 150px; height: 150px;" alt="二维码">
        
        <h1><div>欢迎联系我</div></h1>
        <p>长按上方二维码，或点击下方按钮复制号码直接添加。</p>

        <div class="button-stack" role="navigation">

          <button class="button button-default" onclick="copyWechatId()" style="background-color: #07C160; color: white; border: none; width: 100%; cursor: pointer;">
            <img class="icon" aria-hidden="true" src="images/icons/messenger.svg" alt="微信">💬 点击复制微信号
          </button>

          <button class="button button-default" onclick="copyQqId()" style="background-color: #12B7F5; color: white; border: none; width: 100%; cursor: pointer;">
            <img class="icon" aria-hidden="true" src="images/icons/line.svg" alt="QQ">🐧 点击复制 QQ 号
          </a>

        </div>

        <footer>
          <a href="privacy.html">隐私政策</a>
        </footer>

    </div>
  </div>

  <script>
  // 通用复制函数：仅实现复制功能，并给出弹窗提示
  function performCopy(theId, platformName) {
      const transfer = document.createElement('input');
      document.body.appendChild(transfer);
      transfer.value = theId;
      transfer.focus();
      transfer.select();
      
      try {
          const successful = document.execCommand('copy');
          if (successful) {
              // 友好的文字提示，告诉用户该干什么，不直接唤起 App
              alert("已自动复制 " + platformName + " 号【" + theId + "】到您的剪贴板！\n\n您现在可以直接前往微信/QQ的搜索框，长按粘贴，就能快速找到我了。");
          } else {
              alert("复制失败，可能是浏览器不支持，请手动输入号码: " + theId);
          }
      } catch (err) {
          alert("复制失败，请手动输入号码: " + theId);
      }
      
      document.body.removeChild(transfer);
  }

  function copyWechatId() {
      // ⬇️ A. 【填入你的真实微信号】
      performCopy("你的微信号", "bigyb888");
  }

  function copyQqId() {
      // ⬇️ B. 【填入你的真实 QQ 号】
      performCopy("你的QQ号", "591357736");
  }
  </script>

</body>
</html>
