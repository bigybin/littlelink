<!DOCTYPE html>
<html class="theme-auto" lang="zh-CN">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>欢迎联系我</title>
    <link rel="icon" type="image/x-icon" href="images/avatar.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
  </head>

<body>

  <div class="container">
    <div class="column">

        <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="头像">
        <h1><div>欢迎联系我</div></h1>
        <p>扫码或点击下方按钮，即可快速与我取得联系。</p>

        <div class="button-stack" role="navigation">

          <button class="button button-default" onclick="copyWechatId()" style="background-color: #07C160; color: white; border: none; width: 100%; cursor: pointer;">
            <img class="icon" aria-hidden="true" src="images/icons/messenger.svg" alt="微信">💬 点击自动复制微信号并打开微信
          </button>

          <a class="button button-default" href="mqqwpa://im/chat?chat_type=wpa&uin=2292756616&version=1&src_type=web&web_src=oicqzone.com" target="_blank" rel="noopener" role="button" style="background-color: #12B7F5; color: white; border: none;">
            <img class="icon" aria-hidden="true" src="images/icons/line.svg" alt="QQ">🐧 点击一键加我 QQ 
          </a>

        </div>

        <footer>
          <a href="privacy.html">隐私政策</a>
        </footer>

    </div>
  </div>

  <script>
  function copyWechatId() {
      // ⬇️ 1. 【在这里填入你的真实微信号】
      const wechatId = "bigyb888"; 
      
      // 创建一个临时的隐藏输入框来实现复制功能
      const transfer = document.createElement('input');
      document.body.appendChild(transfer);
      transfer.value = wechatId;
      transfer.focus();
      transfer.select();
      
      try {
          const successful = document.execCommand('copy');
          if (successful) {
              // 复制成功后的提示框
              alert("微信号【" + wechatId + "】已自动复制到你的剪贴板！\n\n点击确定将自动打开微信，直接去搜索框长按粘贴即可。");
              // ⬇️ 2. 尝试唤起手机微信客户端
              window.location.href = "weixin://";
          } else {
              alert("复制失败，请手动输入微信号: " + wechatId);
          }
      } catch (err) {
          alert("复制失败，请手动输入微信号: " + wechatId);
      }
      
      // 清理临时节点
      document.body.removeChild(transfer);
  }
  </script>

</body>
</html>
